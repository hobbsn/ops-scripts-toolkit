name: smoke-tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck（信息性，不阻塞合并）
        run: shellcheck -S error linux/*.sh linux/docker/*.sh
        continue-on-error: true

      - name: 冒烟测试
        run: bash tests/smoke_test.sh
